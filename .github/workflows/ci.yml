name: contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        toolchain: ["1.85.0", "1.88.0", stable]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt,clippy
      - run: cargo +${{ matrix.toolchain }} fmt --all -- --check
      - run: cargo +${{ matrix.toolchain }} clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +${{ matrix.toolchain }} test --release --workspace --locked
      - run: python3 validation/check_dependencies.py
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r validation/requirements.txt
      - run: python -m ruff format --check validation
      - run: python -m ruff check validation
      - run: cargo build --release --workspace --locked
      - run: python validation/check_contracts.py --output contracts.json
      - run: python -O validation/check_contracts.py --output contracts-optimized.json
      - run: diff contracts.json contracts-optimized.json
