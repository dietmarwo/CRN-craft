name: contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        toolchain: ["1.85.0", "1.88.0", stable]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt,clippy
      - run: cargo +${{ matrix.toolchain }} fmt --all -- --check
      - run: cargo +${{ matrix.toolchain }} clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +${{ matrix.toolchain }} test --release --workspace --locked
  contracts:
    runs-on: ubuntu-latest
    # Mutation gate: the mutants of validation/mutation_check.py, on the code of
    # the unified engine.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r validation/requirements.txt
      - run: python -m ruff format --check validation
      - run: python -m ruff check validation
      - run: python validation/check_dependencies.py > dependencies.json
      - run: python -O validation/check_dependencies.py > dependencies-optimized.json
      - run: diff dependencies.json dependencies-optimized.json
      - run: cargo build --release --workspace --locked
      - run: python validation/check_contracts.py --output contracts.json
      - run: python -O validation/check_contracts.py --output contracts-optimized.json
      - run: diff contracts.json contracts-optimized.json
      - run: python validation/check_network.py --output network.json
      - run: python -O validation/check_network.py --output network-optimized.json
      - run: diff network.json network-optimized.json
      - run: python validation/check_structure.py --output structure.json
      - run: python -O validation/check_structure.py --output structure-optimized.json
      - run: diff structure.json structure-optimized.json
      - run: python validation/reference_rng.py
      - run: python validation/check_ssa.py --output ssa.json --latency-output cancellation-latency.json
      - run: python -O validation/check_ssa.py --output ssa-optimized.json
      - run: diff ssa.json ssa-optimized.json
      - run: python validation/check_cme.py --output cme.json
      - run: python -O validation/check_cme.py --output cme-optimized.json
      - run: diff cme.json cme-optimized.json
      - run: python validation/mutation_check.py --output mutations.json
  reference-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r validation/reference-requirements.txt
      - run: cargo build --release --workspace --locked
      - run: python validation/check_export.py --output export.json
      - run: python -O validation/check_export.py --output export-optimized.json
      - run: diff export.json export-optimized.json
      - name: Pin external DSMTS validation inputs
        run: |
          git clone https://github.com/darrenjw/dsmts "$RUNNER_TEMP/dsmts"
          git -C "$RUNNER_TEMP/dsmts" checkout --detach e79fd58e94757fb39926c6373297c1f2a1845894
      - run: python validation/check_fsp.py --binary target/release/crn-craft --dsmts "$RUNNER_TEMP/dsmts" --output fsp.json
      - run: python -O validation/check_fsp.py --binary target/release/crn-craft --dsmts "$RUNNER_TEMP/dsmts" --output fsp-optimized.json
      - run: diff fsp.json fsp-optimized.json
      - run: python validation/check_tau.py --binary target/release/crn-craft --output tau.json
      - run: python -O validation/check_tau.py --binary target/release/crn-craft --output tau-optimized.json
      - run: diff tau.json tau-optimized.json
  rules:
    # K1 exact-law gates for dynamic, attributed species (docs/rules-language.md).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.3.5 jsonschema==4.26.0
      - run: cargo build --release --workspace --locked
      - run: python validation/check_rules.py --output rules.json
      - run: python -O validation/check_rules.py --output rules-optimized.json
      - run: diff rules.json rules-optimized.json
      - run: python validation/check_mtdna.py --binary target/release/crn-craft --output mtdna.json
      - run: python -O validation/check_mtdna.py --binary target/release/crn-craft --output mtdna-optimized.json
      - run: diff mtdna.json mtdna-optimized.json
  python:
    # The wheel, its console scripts and the Python-level checks.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # rebop is a reference for check_builder.py only, not a dependency.
      - run: python -m pip install maturin==1.9.6 numpy==2.3.5 pandas==3.1.1 xarray==2026.9.0 jsonschema==4.26.0 rebop==0.10.0
      - run: cargo build --release --workspace --locked
      - run: maturin build --release --locked --out dist
      - run: python -m pip install dist/*.whl
      - run: python validation/check_python.py --binary target/release/crn-craft --output python.json
      - run: python -O validation/check_python.py --binary target/release/crn-craft --output python-optimized.json
      - run: diff python.json python-optimized.json
      - run: python validation/check_rules_python.py --output rules-python.json
      - run: python -O validation/check_rules_python.py --output rules-python-optimized.json
      - run: diff rules-python.json rules-python-optimized.json
      # The opt-in compiled event loop, built with this checkout, against the
      # interpreter. CARGO_TARGET_DIR reuses the release build above; the -O
      # run and the manual block reuse the cached program.
      - name: Compiled rules event loop
        env:
          CRN_CRAFT_SOURCE: ${{ github.workspace }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          python validation/check_compiled_loop.py --require-cargo --output compiled-loop.json
          python -O validation/check_compiled_loop.py --require-cargo --output compiled-loop-optimized.json
          diff compiled-loop.json compiled-loop-optimized.json
      # Every Python block of the mtDNA manual runs on its own and prints the
      # output shown in the manual; compile_loop blocks build with this checkout.
      - run: python validation/check_manual.py --binary target/release/crn-craft --require-cargo --output manual.json
      - run: python -O validation/check_manual.py --binary target/release/crn-craft --require-cargo --output manual-optimized.json
      - run: diff manual.json manual-optimized.json
      # The frozen manual of release 0.6.0 (never edited): code written for
      # `crn_craft.rules` in 0.6.0 keeps running with the printed output.
      - run: python validation/check_manual.py --manual validation/compat/manual-0.6.0.md --binary target/release/crn-craft --require-cargo --output manual-0-6-0.json
      - run: python -O validation/check_manual.py --manual validation/compat/manual-0.6.0.md --binary target/release/crn-craft --require-cargo --output manual-0-6-0-optimized.json
      - run: diff manual-0-6-0.json manual-0-6-0-optimized.json
      # The README of the Python package runs as printed.
      - run: python validation/check_manual.py --manual python/README.md --require-cargo --output readme.json
      - run: python -O validation/check_manual.py --manual python/README.md --require-cargo --output readme-optimized.json
      - run: diff readme.json readme-optimized.json
      # Every relative link of docs/ and the READMEs resolves.
      - run: python validation/check_links.py
      # The rules.Model builder against exact means and rebop 0.10.0
      # (validation/builder/RESULTS.md).
      - run: python validation/check_builder.py --output builder.json
      - run: python -O validation/check_builder.py --output builder-optimized.json
      - run: diff builder.json builder-optimized.json
      # hybrid against exact laws and against exact thinning on the ATP model,
      # at the default sizes (about 70 s per run; validation/hybrid/RESULTS.md).
      - run: python validation/check_hybrid.py --output hybrid.json
      - run: python -O validation/check_hybrid.py --output hybrid-optimized.json
      - run: diff hybrid.json hybrid-optimized.json
      - run: python validation/check_alternative_contracts.py --binary target/release/crn-craft --output alternative-contracts.json
      - run: python -O validation/check_alternative_contracts.py --binary target/release/crn-craft --output alternative-contracts-optimized.json
      - run: diff alternative-contracts.json alternative-contracts-optimized.json
      - run: python validation/check_alternative_ssa.py --output alternative-laws.json
      - run: python -O validation/check_alternative_ssa.py --output alternative-laws-optimized.json
      - run: diff alternative-laws.json alternative-laws-optimized.json
      - run: python validation/check_importers.py --output importers.json
      - run: python -O validation/check_importers.py --output importers-optimized.json
      - run: diff importers.json importers-optimized.json
      - run: python validation/check_tutorial.py --binary target/release/crn-craft --output tutorial.json
      - run: python -O validation/check_tutorial.py --binary target/release/crn-craft --output tutorial-optimized.json
      - run: diff tutorial.json tutorial-optimized.json
      - name: Installed-package acceptance outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          python -I "$GITHUB_WORKSPACE/validation/check_installed.py" --output installed.json
          python -I -O "$GITHUB_WORKSPACE/validation/check_installed.py" --output installed-optimized.json
          diff installed.json installed-optimized.json
  line-endings:
    # Model hashes cover exact bytes; a Windows-style checkout must keep them.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check out again with core.autocrlf=true
        run: |
          git config core.autocrlf true
          git rm -q -r --cached .
          git reset -q --hard
          converted=$(git ls-files --eol | grep -v -e 'w/lf' -e 'w/none' -e 'attr/-text' || true)
          if [ -n "$converted" ]; then
            echo "Files without LF line endings after an autocrlf checkout:"
            echo "$converted"
            exit 1
          fi
      - run: cargo test --release --locked -p crn-craft --lib --test network_models --test convert --test structure --test stored_requests --test archives_v1
