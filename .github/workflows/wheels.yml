name: Optional wheel acceptance
on:
  workflow_dispatch:
jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install maturin==1.9.6 numpy==2.3.5
      - run: maturin build --release --locked --out dist
      - shell: bash
        run: python -m pip install dist/*.whl
      - run: python validation/check_installed.py --output installed.json
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: |
            dist/*.whl
            installed.json
