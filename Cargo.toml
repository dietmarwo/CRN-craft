[workspace]
members = ["crates/crn-craft", "crates/crn-craft-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
# float_roundtrip: decimal literals parse to the correctly rounded double.
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
serde_path_to_error = "=0.1.20"
schemars = "=0.8.22"
sha2 = "=0.10.9"
crn-craft = { path = "crates/crn-craft" }

[workspace.lints.rust]
unsafe_code = "forbid"
