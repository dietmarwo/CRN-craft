[workspace]
members = ["crates/crn-craft", "crates/crn-craft-cli", "crates/crn-craft-rules"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/dietmarwo/CRN-craft"
homepage = "https://github.com/dietmarwo/CRN-craft"
keywords = ["reaction-network", "gillespie", "ssa", "stochastic", "simulation"]
categories = ["science", "simulation"]

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
# float_roundtrip: decimal literals parse to the correctly rounded double.
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
serde_path_to_error = "=0.1.20"
schemars = "=0.8.22"
sha2 = "=0.10.9"
libm = "=0.2.15"
rand_chacha = { version = "=0.3.1", default-features = false, features = ["std"] }
rand_core = { version = "=0.6.4", default-features = false }
crn-craft = { path = "crates/crn-craft", version = "0.2.0" }
crn-craft-rules = { path = "crates/crn-craft-rules", version = "0.2.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
