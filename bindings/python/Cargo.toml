[workspace]
[package]
name = "crn-craft-python"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
[lib]
name = "_native"
crate-type = ["cdylib"]
[dependencies]
crn-craft = { path = "../../crates/crn-craft" }
pyo3 = { version = "=0.29.0", features = ["extension-module", "abi3-py310"] }
serde_json = "=1.0.154"
serde = "=1.0.229"
