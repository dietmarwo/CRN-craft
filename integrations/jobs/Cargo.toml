[workspace]
[package]
name = "crn-job-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
[dependencies]
crn-craft = { path = "../../crates/crn-craft" }
fcmaes-job-worker = { git = "https://github.com/dietmarwo/fcmaes-rust", rev = "f764a7516f41bf2d88009b156daa70bf0a5445c1" }
