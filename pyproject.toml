[build-system]
requires = ["maturin==1.9.6"]
build-backend = "maturin"
[project]
name = "crn-craft"
version = "0.5.0"
requires-python = ">=3.10"
description = "Reproducible well-mixed reaction network simulation and analysis"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
readme = "python/README.md"
# xarray 2024.6 is the first release that supports NumPy 2.
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<4", "xarray>=2024.6"]
keywords = ["chemical reaction networks", "stochastic simulation", "Gillespie", "SSA", "systems biology", "Rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Documentation = "https://github.com/dietmarwo/CRN-craft/blob/main/docs/tutorial.md"
Issues = "https://github.com/dietmarwo/CRN-craft/issues"
Changelog = "https://github.com/dietmarwo/CRN-craft/blob/main/CHANGELOG.md"
"Optimization ecosystem" = "https://dietmarwo.github.io/optimization-jobs/"
"AI agent guide" = "https://github.com/dietmarwo/CRN-craft/blob/main/docs/ai-context.md"
Repository = "https://github.com/dietmarwo/CRN-craft"
[project.scripts]
crn-craft = "crn_craft.__main__:main"
crn-craft-import = "crn_craft.importers:main"

[project.optional-dependencies]
fit = ["scipy==1.17.0", "fcmaes-rust==0.2.1", "sqp-craft==0.17.0"]
# xarray is required since 0.5.0; the extra stays so that existing
# `pip install "crn-craft[xarray]"` commands keep working.
xarray = ["xarray>=2024.6"]
[tool.maturin]
manifest-path = "bindings/python/Cargo.toml"
python-source = "python"
module-name = "crn_craft._native"
include = [
  { path = "Cargo.lock", format = "sdist" },
  { path = "Cargo.toml", format = "sdist" },
  { path = "LICENSE", format = "sdist" },
  { path = "crates/**/*", format = "sdist" },
  { path = "schemas/**/*", format = "sdist" },
  { path = "models/**/*", format = "sdist" },
  { path = "docs/campaign/**/*", format = "sdist" },
  { path = "validation/rng-vectors.json", format = "sdist" }
]

[tool.ruff]
target-version = "py310"
line-length = 88
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
