[workspace]
[package]
name = "crn-parameter-bench-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"
[features]
rebop-macro = ["dep:rebop"]
[dependencies]
crn-craft = { path = "../../../crates/crn-craft" }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
rebop = { version = "=0.10.0", optional = true }
[lints.rust]
unsafe_code = "forbid"
